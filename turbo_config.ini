[TurboMode]
; Base speed multiplier when Turbo is enabled (Default: 2.5)
; Official presets: 1.5, 2.0, 2.5, 3.0, 3.5, 4.0
; Using custom numbers locks the game to that speed and disables cycling.
SpeedMultiplier=2.5

; Gamepad toggle button. Set to NONE or OFF to disable controller toggle.
; Options: RIGHT_TRIGGER (RT), LEFT_TRIGGER (LT), RIGHT_THUMB (R3), LEFT_THUMB (L3), LB, RB, NONE
GamepadButton=RIGHT_TRIGGER

; Keyboard toggle key in hex virtual-key code (Default: 0x70 = F1)
KeyboardKey=0x70

; In-game speed cycling switch (1 = Enabled, 0 = Disabled)
EnableSpeedCycling=1

; In-game speed cycling hotkeys (cycles through 1.5x to 4.0x)
CycleSpeedKey=0x71
CycleSpeedGamepad=LEFT_THUMB

; 0 = Speed toast auto-hides after 1.5s, 1 = Always visible while Turbo is ON
AlwaysShowSpeed=0

; Input debounce in milliseconds
DebounceMs=250
